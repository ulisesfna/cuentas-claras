<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f766e">
  <meta name="description" content="Gestor de gastos personal: registra gastos e ingresos, cuentas, presupuestos y más.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Cuentas Claras">
  <title>Cuentas Claras</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div id="app">
    <header class="app-head">
      <div class="topbar">
        <button id="btnMenu" class="icon-btn" data-icon="menu" aria-label="Menú"></button>
        <button id="btnAccount" class="account-switch" aria-label="Cambiar cuenta">
          <span id="accountLabel">Todas las cuentas</span><span data-icon="chevD"></span>
        </button>
        <button id="btnTransfer" class="icon-btn" data-icon="transfer" aria-label="Nueva transferencia" title="Transferencia entre cuentas"></button>
        <button id="btnStats" class="icon-btn" data-icon="chart" aria-label="Análisis" title="Análisis"></button>
        <button id="btnSearch" class="icon-btn" data-icon="search" aria-label="Buscar" title="Buscar (/)"></button>
      </div>
      <nav class="period-bar" aria-label="Período">
        <button id="prevPeriod" class="icon-btn" data-icon="chevL" aria-label="Período anterior"></button>
        <button id="periodLabel" class="period-label" aria-label="Elegir período"></button>
        <button id="nextPeriod" class="icon-btn" data-icon="chevR" aria-label="Período siguiente"></button>
      </nav>
    </header>

    <main class="main">
      <div id="notice" class="notice-slot" role="region" aria-label="Avisos" hidden></div>
      <div id="filterBar" class="filter-bar" role="status" hidden></div>
      <section class="card overview" aria-label="Resumen">
        <div id="ring" class="ring"></div>
        <div class="quick">
          <button id="btnAddExpense" class="btn-expense" aria-label="Añadir gasto"><span class="sign">−</span> Gasto</button>
          <button id="btnAddIncome" class="btn-income" aria-label="Añadir ingreso"><span class="sign">+</span> Ingreso</button>
        </div>
        <div class="balance">
          <span>Saldo</span>
          <strong id="balanceValue">0</strong>
        </div>
      </section>

      <section id="upcoming" class="card upcoming" aria-label="Próximos movimientos" hidden></section>

      <section class="card details" aria-label="Movimientos">
        <div class="list-head">
          <h2>Movimientos</h2>
          <div class="seg list-mode" role="tablist" aria-label="Agrupar por">
            <button data-mode="category" role="tab">Categorías</button>
            <button data-mode="date" role="tab">Fechas</button>
          </div>
        </div>
        <div id="txList"></div>
      </section>
    </main>
  </div>

  <div id="toast" role="status" aria-live="polite"></div>

  <noscript>Cuentas Claras necesita JavaScript.</noscript>
  <script type="module" src="js/main.js"></script>
</body>
</html>
